<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cocardo: ¡Rescate Helado!</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="description" content="Juego de fans tipo «junta 3»: descongela a las frutas de la heladería de Cocardo. Inspirado en la frutinovela viral La Nieve de Lima.">
<meta name="theme-color" content="#ff6fa5">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&family=Yellowtail&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<div id="app">
  <!-- Portada -->
  <section id="screen-title" class="screen" aria-label="Portada" hidden></section>
  <!-- Mapa de niveles -->
  <section id="screen-map" class="screen" aria-label="Mapa" hidden></section>
  <!-- Tablero (lo construye Cocardo.Game) -->
  <section id="screen-game" class="screen" aria-label="Juego" hidden></section>
  <!-- Reto Diario -->
  <section id="screen-daily" class="screen" aria-label="Reto Diario" hidden></section>
  <!-- Álbum de personajes -->
  <section id="screen-album" class="screen" aria-label="Álbum" hidden></section>
  <!-- Ajustes -->
  <section id="screen-settings" class="screen" aria-label="Ajustes" hidden></section>
  <!-- Capas: historia, intro, pausa, victoria, derrota, telenovela -->
  <div id="overlays"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div id="flash" class="flash" aria-hidden="true"></div>
  <noscript><p class="noscript">Este juego necesita JavaScript para funcionar.</p></noscript>
</div>
<script src="js/core/rng.js"></script>
<script src="js/core/engine.js"></script>
<script src="js/core/levels.js"></script>
<script src="js/core/daily.js"></script>
<script src="js/story.js"></script>
<script src="js/art.js"></script>
<script src="js/art-characters.js"></script>
<script src="js/audio.js"></script>
<script src="js/save.js"></script>
<script src="js/fx.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
