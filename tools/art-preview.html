<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vista previa del arte — Cocardo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&family=Yellowtail&display=swap">
<style>
  :root { --ink:#2b1630; --cream:#fff6ea; --board:#3b2550; --board2:#4a2f63; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:#fff6ea; color:var(--ink); font-family:'Nunito', system-ui, sans-serif; }
  h1 { font-family:'Lilita One', sans-serif; margin:0 0 8px; }
  h2 { font-family:'Lilita One', sans-serif; font-size:18px; margin:18px 0 6px; }
  .row { display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; }
  .board { background:repeating-conic-gradient(var(--board) 0 25%, var(--board2) 0 50%) 0 0/96px 96px; padding:8px; border-radius:14px; display:inline-flex; flex-wrap:wrap; gap:0; }
  .board.s48 { background-size:48px 48px; }
  .cell { display:inline-block; line-height:0; }
  .s96 .cell, .s96 .cell svg { width:96px; height:96px; }
  .s48 .cell, .s48 .cell svg { width:48px; height:48px; }
  .s32 .cell, .s32 .cell svg { width:32px; height:32px; }
  .lbl { font-size:11px; text-align:center; color:#7a6a7a; }
  .item { display:inline-flex; flex-direction:column; align-items:center; }
  .stack { position:relative; width:96px; height:96px; }
  .stack svg { position:absolute; inset:0; width:96px; height:96px; }
  .icons { color:var(--ink); }
  .icons svg { width:32px; height:32px; }
  .icons.dark { background:#5b1e74; color:#fff; padding:8px; border-radius:10px; }
  .bg { width:180px; height:320px; border-radius:12px; overflow:hidden; display:inline-block; }
  .bg svg { width:100%; height:100%; display:block; }
  .fz svg { width:192px; height:192px; }
  .logo svg { width:420px; height:210px; }
  .logo.small svg { width:200px; height:100px; }
  .warn { color:#d61f4b; font-weight:800; }
  #sizes { font-size:12px; }
</style>
</head>
<body>
<h1>Cocardo · Arte del tablero</h1>
<div id="sizes"></div>
<div id="out"></div>
<script src="../js/art.js"></script>
<script>
  // art-characters.js es opcional (lo escribe otro agente)
  document.write('<script src="../js/art-characters.js" onerror="this.remove()"><\/script>');
</script>
<script>
(function () {
  'use strict';
  var A = window.Cocardo.Art, out = document.getElementById('out'), sizes = [];
  var COLS = ['L', 'F', 'B', 'U', 'N', 'D'];
  function track(name, s) { sizes.push([name, s.length]); return s; }
  function sec(title, html) { out.insertAdjacentHTML('beforeend', '<h2>' + title + '</h2>' + html); }
  function cell(svg) { return '<span class="cell">' + svg + '</span>'; }
  function board(cls, cells) { return '<div class="board ' + cls + '">' + cells.join('') + '</div>'; }
  function item(svg, lbl, cls) { return '<div class="item ' + (cls || '') + '">' + svg + '<div class="lbl">' + lbl + '</div></div>'; }

  // fichas por cara
  ['normal', 'blink', 'scared', 'happy'].forEach(function (face) {
    sec('Fichas · ' + face + ' (96 / 48)', '<div class="row">' +
      board('s96', COLS.map(function (c) { return cell(track('tile ' + c + ' ' + face, A.tile(c, { face: face }))); })) +
      board('s48', COLS.map(function (c) { return cell(A.tile(c, { face: face })); })) + '</div>');
  });
  ['ph', 'pv', 'bomba'].forEach(function (t) {
    sec('Especiales · ' + t, '<div class="row">' +
      board('s96', COLS.map(function (c) { return cell(track(t + ' ' + c, A.tile(c, { type: t }))); })) +
      board('s48', COLS.map(function (c) { return cell(A.tile(c, { type: t })); })) + '</div>');
  });
  // tablero mezclado a 48 px
  function mixBoard() {
  var mix = [];
  var seq = 'LFBUNDUNLDFBBDLNUFNULFDBDBFULNFLUNBDLNDFUB';
  for (var i = 0; i < 64; i++) {
    var c = seq[i % seq.length], s;
    if (i === 9) s = A.tile(c, { type: 'ph' }); else if (i === 20) s = A.tile(c, { type: 'pv' });
    else if (i === 27) s = A.tile(c, { type: 'bomba' }); else if (i === 36) s = A.copa();
    else if (i === 44) s = A.ice(2, 2); else if (i === 45) s = A.ice(1, 2); else if (i === 52) s = A.crate();
    else if (i === 53) s = A.friend('lima', 2, 2); else if (i === 59) s = A.token('uva'); else if (i === 61) s = A.token('prueba');
    else s = A.tile(c, { face: i % 11 === 0 ? 'blink' : 'normal' });
    mix.push(cell(s));
  }
  return mix.join('');
  }
  sec('Tablero 8×8 de prueba (48 px y 32 px)', '<div class="row"><div class="board s48" style="width:400px">' + mixBoard() + '</div>' +
    '<div class="board s32" style="width:272px;background-size:32px 32px">' + mixBoard() + '</div></div>');

  sec('Copa, fichas y escarcha', '<div class="row">' + board('s96', [cell(track('copa', A.copa())), cell(track('token uva', A.token('uva'))), cell(track('token prueba', A.token('prueba')))]) +
    board('s48', [cell(A.copa()), cell(A.token('uva')), cell(A.token('prueba'))]) +
    board('s96', COLS.map(function (c) { return '<span class="cell stack">' + A.tile(c, { face: 'scared' }) + track('frost', A.frost()) + '</span>'; })) + '</div>');

  sec('Hielo (hp/max), caja', '<div class="row">' + board('s96', [[1, 1], [2, 2], [1, 2], [3, 3], [2, 3], [1, 3]].map(function (h) { return cell(track('ice ' + h, A.ice(h[0], h[1]))); }).concat([cell(track('crate', A.crate()))])) +
    board('s48', [[1, 1], [2, 2], [1, 2], [3, 3], [2, 3], [1, 3]].map(function (h) { return cell(A.ice(h[0], h[1])); }).concat([cell(A.crate())])) + '</div>');

  var WHO = ['lima', 'fresa', 'banana', 'uva', 'naranja', 'durazna', 'cocardo', 'cereza', 'pina', 'banano', 'limon', 'policia_fresa', 'policia_sandia', 'guardaespaldas', 'brocoli', 'reportera'];
  sec('Amigos congelados (hp 2/2, 1/2; 3/3, 2/3)', '<div class="row">' + board('s96', WHO.map(function (w) { return cell(track('friend ' + w, A.friend(w, 2, 2))); })) + '</div><div class="row" style="margin-top:6px">' +
    board('s96', ['lima', 'fresa', 'naranja', 'banano'].map(function (w) { return cell(A.friend(w, 1, 2)); }).concat(['lima', 'naranja'].map(function (w) { return cell(A.friend(w, 3, 3)); })).concat(['lima', 'naranja'].map(function (w) { return cell(A.friend(w, 2, 3)); }))) +
    board('s48', WHO.slice(0, 6).map(function (w) { return cell(A.friend(w, 2, 2)); })) + '</div>');

  sec('Congeladores (hp 8,6,4,2 de 8)', '<div class="row fz">' + [8, 6, 4, 2].map(function (h) { return item(track('freezer cocardo ' + h, A.freezer('cocardo', h, 8)), 'cocardo ' + h + '/8'); }).join('') + '</div><div class="row fz">' +
    [8, 6, 4, 2].map(function (h) { return item(track('freezer cereza ' + h, A.freezer('cereza', h, 8)), 'cereza ' + h + '/8'); }).join('') + '</div>');

  var names = A.iconNames.concat(['snowflake']).filter(function (n, i, a) { return a.indexOf(n) === i; });
  sec('Iconos', '<div class="row icons">' + names.map(function (n) { return item(track('icon ' + n, A.icon(n)), n); }).join('') + '</div>' +
    '<div class="row icons dark" style="margin-top:6px">' + names.map(function (n) { return item(A.icon(n), n); }).join('') + '</div>');

  sec('Logo', '<div class="row"><div class="logo">' + track('logo', A.logo()) + '</div><div class="logo small" style="background:#5b1e74;padding:6px;border-radius:12px">' + A.logo() + '</div></div>');

  sec('Fondos', '<div class="row">' + A.zones.map(function (z) { return item('<div class="bg">' + track('bg ' + z, A.background(z)) + '</div>', z); }).join('') + '</div>');

  if (A.portrait) {
    sec('Retratos (art-characters.js)', '<div class="row">' + WHO.map(function (w) { return item('<div style="width:96px;height:96px">' + A.portrait(w) + '</div>', w); }).join('') + '</div>');
  }

  var big = sizes.filter(function (s) { return s[1] > 12000; });
  var max = sizes.reduce(function (m, s) { return s[1] > m[1] ? s : m; }, ['', 0]);
  document.getElementById('sizes').innerHTML = 'SVG generados: ' + sizes.length + ' · más grande: ' + max[0] + ' (' + max[1] + ' B)' +
    (big.length ? ' · <span class="warn">&gt;12 KB: ' + big.map(function (s) { return s[0] + ' ' + s[1]; }).join(', ') + '</span>' : '');
  // ids únicos
  var ids = {}, dup = 0;
  document.querySelectorAll('[id]').forEach(function (el) { if (ids[el.id]) dup++; ids[el.id] = 1; });
  if (dup) document.getElementById('sizes').insertAdjacentHTML('beforeend', ' · <span class="warn">ids duplicados: ' + dup + '</span>');
})();
</script>
</body>
</html>
