<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocardo: versión completa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&family=Yellowtail&display=swap">
<link rel="stylesheet" href="../css/store.css">
<style>
  :root {
    --ink: #2b1630; --cream: #fff6ea; --mint: #bff3e1; --pink: #ff6fa5; --cherry: #d61f4b; --coco: #7a4a2a;
    --ice: #bfe9ff; --ice-deep: #4aa8e0; --gold: #ffc93c; --drama: #5b1e74; --drama-2: #a1286a; --ok: #33b679;
    --font-display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
    --font-script: 'Yellowtail', 'Brush Script MT', cursive;
    --font-body: 'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: linear-gradient(180deg, var(--mint), var(--cream) 320px); color: var(--ink);
    font-family: var(--font-body); }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 4px 0 2px; color: var(--drama); }
  h2 { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 18px 0 8px; color: var(--drama-2); }
  p.sub { margin: 0 0 10px; font-size: 14px; opacity: .85; }
  .warn { font-size: 13px; font-weight: 800; padding: 8px 12px; border-radius: 12px; background: #fff1d6; border: 2px solid var(--ink); }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .grid button { font: 800 14px var(--font-body); color: var(--ink); background: #fff; border: 2px solid var(--ink);
    border-radius: 12px; padding: 9px 12px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  .grid button:active { transform: translateY(3px); box-shadow: none; }
  .map { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
  .node { height: 46px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; font: 400 18px var(--font-display);
    display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .node.locked { background: #e9e1ef; color: #8a7896; }
  .node.locked::after { content: '🔒'; position: absolute; right: -6px; bottom: -6px; font-size: 15px; }
  pre { font: 600 12px/1.45 ui-monospace, Menlo, Consolas, monospace; background: #fff; border: 2px solid var(--ink);
    border-radius: 12px; padding: 10px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div id="app">
<main>
  <h1>Cocardo: versión completa</h1>
  <p class="sub">Vista previa de <code>js/store.js</code> y <code>css/store.css</code>. El progreso vive en memoria: recargar borra todo.</p>
  <p class="warn">Esta página usa una <b>clave de prueba</b> propia y un enlace de pago de ejemplo. Los códigos de aquí no
    sirven en el juego de verdad.</p>

  <h2>Pantallas</h2>
  <div class="grid">
    <button data-open="paywall" data-reason="cliff">Muro (después del nivel 10)</button>
    <button data-open="paywall" data-reason="lock">Muro (toqué un candado)</button>
    <button data-open="redeem">Canjear código</button>
    <button data-open="success">Éxito</button>
    <button data-open="status">Ajustes: versión completa</button>
  </div>

  <h2>Pruebas</h2>
  <div class="grid">
    <button id="link-ok">Abrir enlace de compra válido</button>
    <button id="link-bad">Abrir enlace alterado</button>
    <button id="reset">Quitar la versión completa</button>
    <button id="selling">Venta: encendida</button>
  </div>

  <h2>Mapa (candados)</h2>
  <div class="map" id="map"></div>

  <h2>Estado</h2>
  <pre id="state"></pre>
</main>
</div>

<script src="../js/core/license.js"></script>
<script src="../js/store.js"></script>
<script>
(function () {
  'use strict';
  var C = window.Cocardo;
  // Save mínimo en memoria con la forma de ARQUITECTURA §10
  var saveData = { v: 1, unlocked: 30, license: null };
  C.Save = { get: function () { return saveData; }, save: function () {} };

  // Clave SOLO de esta vista previa (la privada se descartó). Producción usa otra.
  C.License.PUBLIC_KEY = { kty: 'EC', crv: 'P-256', x: 'vkMLBoZ68pPYA2G-kWrjdjm2S5CCBYD9njsOkm5wde8',
    y: 'swQKBx8sXtgKmnUC3jpNgevTKUBRmFZbXCuXUQmTL4o' };
  var GOOD = 'AQEAAAPpfwKxsTiUXFi2HUNxcDIsrhAEW2SsU8Ma_uV5haj3yP-95pTOdHnD3GtHEqjVUT6qXBHFyJFf_UUdDWJCbjT4ww';
  var BAD = GOOD.slice(0, 40) + (GOOD[40] === 'A' ? 'B' : 'A') + GOOD.slice(41);
  var cfg = C.Store.config;
  cfg.buyUrl = 'https://example.com/comprar-cocardo';
  cfg.donateUrl = 'https://example.com/invitame-un-helado';
  cfg.price = 'US$1,99';
  cfg.contact = 'cocardo.fan@example.com';

  var map = document.getElementById('map');
  function draw() {
    map.textContent = '';
    for (var i = 1; i <= 30; i++) {
      var n = document.createElement('button');
      n.type = 'button';
      n.className = 'node' + (C.Store.isLocked(i) ? ' locked' : '');
      n.textContent = i;
      n.setAttribute('aria-label', 'Nivel ' + i + (C.Store.isLocked(i) ? ', versión completa' : ''));
      n.addEventListener('click', (function (id) {
        return function () { if (C.Store.isLocked(id)) C.Store.open('paywall', { reason: 'lock', onClose: draw }); };
      })(i));
      map.appendChild(n);
    }
    document.getElementById('state').textContent = JSON.stringify({
      selling: C.Store.selling(), full: C.Store.isFull(), canVerify: C.Store.canVerify(),
      hash: location.hash, license: saveData.license }, null, 2);
    document.getElementById('selling').textContent = 'Venta: ' + (cfg.buyUrl ? 'encendida' : 'apagada');
  }
  C.Store.onChange(draw);

  document.querySelectorAll('[data-open]').forEach(function (b) {
    b.addEventListener('click', function () {
      C.Store.open(b.dataset.open, { reason: b.dataset.reason, onClose: draw });
    });
  });
  function viaLink(code) { location.hash = 'licencia=' + code; C.Store.init().then(draw); }
  document.getElementById('link-ok').addEventListener('click', function () { viaLink(GOOD); });
  document.getElementById('link-bad').addEventListener('click', function () { viaLink(BAD); });
  document.getElementById('reset').addEventListener('click', function () { C.Store.setFull(false); draw(); });
  document.getElementById('selling').addEventListener('click', function () {
    cfg.buyUrl = cfg.buyUrl ? '' : 'https://example.com/comprar-cocardo';
    draw();
  });
  window.__preview = { GOOD: GOOD, BAD: BAD, draw: draw };
  C.Store.init().then(draw);
})();
</script>
</body>
</html>
