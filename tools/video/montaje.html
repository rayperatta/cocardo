<!-- Página genérica: carga el arte y el audio del juego, el kit, y el montaje de ?m=montajes/xx.js.
     Se abre con: node tools/video/grabar.cjs "tools/video/montaje.html?m=montajes/xx.js" salida.mp4 --cap <capturas> -->
<script src="../../js/audio.js"></script>
<script src="../../js/art.js"></script>
<script src="../../js/art-characters.js"></script>
<script src="video.js"></script>
<script src="kit.js"></script>
<script>
(function () {
  var m = new URLSearchParams(location.search).get('m');
  if (!m || !/^[\w\/.-]+\.js$/.test(m)) { window.__error = 'falta ?m=montajes/xx.js'; return; }
  var s = document.createElement('script');
  s.src = m;
  s.onerror = function () { window.__error = 'no se pudo cargar ' + m; };
  document.body.appendChild(s);
})();
</script>
